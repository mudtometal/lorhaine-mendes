<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Website editor — Lorhaine Mendes</title>
<link rel="stylesheet" href="studio.css?v=2">
</head>
<body>
<header class="bar">
  <div class="brand"><b>Lorhaine Mendes</b><span>Website editor</span></div>
  <div class="actions">
    <span class="chip"></span>
    <button class="btn discard" hidden>Discard changes</button>
    <button class="btn primary publish">Publish changes</button>
  </div>
</header>

<div class="shell">
  <nav class="nav">
    <a href="#/" data-nav="projects">Projects</a>
    <a href="#/about" data-nav="about">About</a>
    <a href="#/settings" data-nav="settings">Credits page</a>
    <hr>
    <a href="../" target="_blank" rel="noopener">View website ↗</a>
  </nav>
  <main class="view"></main>
  <aside class="preview">
    <div class="card pcard">
      <div class="phead">
        <h3>Preview</h3>
        <div class="tabs"><button data-pv="desk" class="on">Desktop</button><button data-pv="phone">Phone</button></div>
      </div>
      <div class="pframe"><div class="pscale"><iframe title="Preview"></iframe></div></div>
      <p class="pnote">Shows your changes before they are published.</p>
    </div>
  </aside>
</div>

<dialog class="connect">
  <form method="dialog">
    <h2>Connect publishing</h2>
    <p>Paste the publishing key you were given. You only need to do this once on this computer.</p>
    <input class="input token" type="password" autocomplete="off" placeholder="Publishing key">
    <div class="drow"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Connect</button></div>
  </form>
</dialog>
<input class="filepick" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple hidden>
<script src="studio.js?v=2" type="module"></script>
</body>
</html>
