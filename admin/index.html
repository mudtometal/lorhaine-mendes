<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio editor</title>
<link rel="stylesheet" href="studio.css?v=12">
</head>
<body>
<header class="top">
  <a class="brand" href="../" target="_blank" rel="noopener" title="Open the website">Portfolio editor</a>
  <div class="device"><button data-dev="desk" class="on">Desktop</button><button data-dev="phone">Phone</button></div>
  <div class="right">
    <button class="tbtn undo" title="Undo (⌘Z)" disabled>Undo</button>
    <a class="tbtn" href="../" target="_blank" rel="noopener">View site</a>
    <span class="state"></span><button class="tbtn discard" hidden>Discard draft</button>
    <button class="pub">Publish</button>
  </div>
</header>

<div class="app">
  <nav class="side">
    <div class="sh">Projects</div>
    <div class="plist"></div>
    <button class="addp">+ New project</button>
    <div class="sh pages">Pages</div>
    <button class="pg" data-page="info">Name &amp; info</button>
    <button class="pg" data-page="credits">Credits page</button>
  </nav>

  <section class="stage">
    <div class="canvas"><div class="frame"><div class="scaler"><iframe title="Preview"></iframe><iframe title="Preview" class="back" aria-hidden="true"></iframe></div></div></div>
    <div class="strip">
      <div class="striphead"><span class="sl"></span><span class="sp"></span><span class="tip">Drag to reorder. Drop files anywhere to add them.</span></div>
      <div class="slides"></div>
    </div>
    <div class="dropcover"><div>Drop to add to <b class="dpn"></b></div></div>
  </section>

  <aside class="panel"></aside>
</div>

<dialog class="connect">
  <form method="dialog">
    <h2>Connect publishing</h2>
    <p>Paste the publishing key you were given. You only do this once on this computer.</p>
    <input class="token" type="password" autocomplete="off" placeholder="Publishing key">
    <div class="drow"><button value="cancel">Cancel</button><button value="ok" class="pub">Connect</button></div>
  </form>
</dialog>
<input class="bgpick" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" hidden>
<input class="filepick" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple hidden>
<script src="studio.js?v=12" type="module"></script>
</body>
</html>
